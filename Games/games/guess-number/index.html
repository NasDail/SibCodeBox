<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Угадай число</title><style>
:root{color-scheme:dark;font-family:system-ui,Segoe UI,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#163454,#060b15 65%);color:#f3f8ff;display:grid;place-items:center;padding:24px}.game{width:min(900px,100%);text-align:center;background:#0b1728;border:1px solid #294968;border-radius:28px;padding:clamp(22px,5vw,48px);box-shadow:0 20px 70px #0009}h1{font-size:clamp(32px,6vw,58px);margin:0 0 12px}p{color:#b4c8da;font-size:18px;line-height:1.5}.primary{border:0;border-radius:14px;padding:16px 28px;background:#00efbd;color:#04131a;font-weight:900;font-size:19px;cursor:pointer}.secondary{border:1px solid #3a607c;background:#132942;color:white;border-radius:12px;padding:12px 18px;font-size:16px;cursor:pointer}.muted{font-size:13px;color:#7f9ab3}.score{font-size:clamp(28px,5vw,48px);font-weight:900;color:#00efbd}.keys{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}.keys kbd{background:#1b314b;border:1px solid #46617e;border-radius:6px;padding:4px 9px;color:#fff}
</style><style>.number{font-size:clamp(64px,12vw,110px);font-weight:1000;color:#c9baff;letter-spacing:8px}.guess{width:180px;text-align:center;background:#07111e;border:2px solid #6554ad;border-radius:12px;color:white;padding:14px;font-size:24px;margin:12px}</style></head><body><main class="game"><h1>🔮 Угадай число</h1><p>Я загадал число от 1 до 100. Найди его за минимальное число попыток.</p><div class="number">?</div><div><input id="guess" class="guess" type="number" min="1" max="100" placeholder="1–100"><button id="try" class="primary">ПРОВЕРИТЬ</button></div><div class="score" id="feedback">У тебя получится!</div><p id="tries" class="muted">Попыток: 0</p><button id="restart" class="secondary">НОВАЯ ИГРА</button><p class="muted">Enter — проверить · Esc — выйти</p></main><script>
let secret=0,attempts=0,done=false;const input=document.getElementById('guess'),feedback=document.getElementById('feedback'),tries=document.getElementById('tries');function start(){secret=1+Math.floor(Math.random()*100);attempts=0;done=false;feedback.textContent='У тебя получится!';tries.textContent='Попыток: 0';input.value='';input.disabled=false;document.querySelector('.number').textContent='?';input.focus()}
function submit(){if(done)return;const n=Number(input.value);if(!Number.isInteger(n)||n<1||n>100){feedback.textContent='Введи число от 1 до 100';return}attempts++;tries.textContent=`Попыток: ${attempts}`;if(n===secret){done=true;input.disabled=true;const score=Math.max(10,1000-(attempts-1)*80);feedback.textContent=`Верно! ${score} очков`;document.querySelector('.number').textContent=secret;parent.postMessage({type:'SCORE',score},'*')}else feedback.textContent=n<secret?'Больше ↑':'Меньше ↓';input.select()}
document.getElementById('try').onclick=submit;document.getElementById('restart').onclick=start;input.addEventListener('keydown',e=>{if(e.key==='Enter')submit()});addEventListener('keydown',e=>{if(e.key==='Escape')parent.postMessage({type:'SCBB_GAME_ESCAPE'},'*')});start();
</script></body></html>
