<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"> <title>Змейка</title><style>
:root{color-scheme:dark;font-family:system-ui,Segoe UI,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#163454,#060b15 65%);color:#f3f8ff;display:grid;place-items:center;padding:24px}.game{width:min(900px,100%);text-align:center;background:#0b1728;border:1px solid #294968;border-radius:28px;padding:clamp(22px,5vw,48px);box-shadow:0 20px 70px #0009}h1{font-size:clamp(32px,6vw,58px);margin:0 0 12px}p{color:#b4c8da;font-size:18px;line-height:1.5}.primary{border:0;border-radius:14px;padding:16px 28px;background:#00efbd;color:#04131a;font-weight:900;font-size:19px;cursor:pointer}.secondary{border:1px solid #3a607c;background:#132942;color:white;border-radius:12px;padding:12px 18px;font-size:16px;cursor:pointer}.muted{font-size:13px;color:#7f9ab3}.score{font-size:clamp(28px,5vw,48px);font-weight:900;color:#00efbd}.keys{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}.keys kbd{background:#1b314b;border:1px solid #46617e;border-radius:6px;padding:4px 9px;color:#fff}
</style><style>.board{display:block;margin:22px auto;background:#06101c;border:2px solid #2b526e;border-radius:16px;width:min(520px,100%);height:auto;image-rendering:pixelated}</style></head><body><main class="game"><h1>🐍 Змейка</h1><p>Собирай яблоки и не врезайся в стены или хвост.</p><div class="score">Счёт: <span id="score">0</span></div><canvas id="board" class="board" width="520" height="520"></canvas><div><button id="start" class="primary">НАЧАТЬ / ЗАНОВО</button></div><div class="keys"><span><kbd>←</kbd><kbd>↑</kbd><kbd>↓</kbd><kbd>→</kbd> движение</span><span class="muted">Esc — выйти</span></div><p id="message" class="muted">Нажми Enter или кнопку, чтобы начать.</p></main><script>
const c=document.getElementById('board'),ctx=c.getContext('2d'),scoreEl=document.getElementById('score'),msg=document.getElementById('message');const cell=26,cols=20,rows=20;let snake,dir,next,food,score,timer,live=false;
function placeFood(){do{food={x:Math.floor(Math.random()*cols),y:Math.floor(Math.random()*rows)}}while(snake.some(p=>p.x===food.x&&p.y===food.y))}
function draw(){ctx.fillStyle='#06101c';ctx.fillRect(0,0,520,520);ctx.fillStyle='#ff647d';ctx.beginPath();ctx.arc(food.x*cell+13,food.y*cell+13,10,0,Math.PI*2);ctx.fill();snake.forEach((p,i)=>{ctx.fillStyle=i?'#16b98f':'#8affd8';ctx.fillRect(p.x*cell+2,p.y*cell+2,22,22)});}
function finish(text){live=false;clearInterval(timer);msg.textContent=text+' Итог: '+score;parent.postMessage({type:'SCORE',score},'*')}
function tick(){dir=next;const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(head.x<0||head.y<0||head.x>=cols||head.y>=rows||snake.some(p=>p.x===head.x&&p.y===head.y)){finish('Игра окончена.');return}snake.unshift(head);if(head.x===food.x&&head.y===food.y){score+=10;scoreEl.textContent=score;placeFood()}else snake.pop();draw()}
function start(){clearInterval(timer);snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];dir={x:1,y:0};next={...dir};score=0;scoreEl.textContent='0';live=true;placeFood();draw();msg.textContent='Отлично! Продолжай собирать яблоки.';timer=setInterval(tick,135)}
addEventListener('keydown',e=>{const map={ArrowUp:{x:0,y:-1},ArrowDown:{x:0,y:1},ArrowLeft:{x:-1,y:0},ArrowRight:{x:1,y:0},w:{x:0,y:-1},s:{x:0,y:1},a:{x:-1,y:0},d:{x:1,y:0}};if(e.key==='Escape'){parent.postMessage({type:'SCBB_GAME_ESCAPE'},'*');return}const d=map[e.key];if(d&&live){e.preventDefault();if(d.x!==-dir.x||d.y!==-dir.y)next=d}});document.getElementById('start').onclick=start;addEventListener('keydown',e=>{if(e.key==='Enter'&&!live)start()});draw();
</script></body></html>
