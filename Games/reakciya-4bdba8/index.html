<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Реакция</title><style>
:root{color-scheme:dark;font-family:system-ui,Segoe UI,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#163454,#060b15 65%);color:#f3f8ff;display:grid;place-items:center;padding:24px}.game{width:min(900px,100%);text-align:center;background:#0b1728;border:1px solid #294968;border-radius:28px;padding:clamp(22px,5vw,48px);box-shadow:0 20px 70px #0009}h1{font-size:clamp(32px,6vw,58px);margin:0 0 12px}p{color:#b4c8da;font-size:18px;line-height:1.5}.primary{border:0;border-radius:14px;padding:16px 28px;background:#00efbd;color:#04131a;font-weight:900;font-size:19px;cursor:pointer}.secondary{border:1px solid #3a607c;background:#132942;color:white;border-radius:12px;padding:12px 18px;font-size:16px;cursor:pointer}.muted{font-size:13px;color:#7f9ab3}.score{font-size:clamp(28px,5vw,48px);font-weight:900;color:#00efbd}.keys{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}.keys kbd{background:#1b314b;border:1px solid #46617e;border-radius:6px;padding:4px 9px;color:#fff}
</style><style>.signal{height:190px;display:grid;place-items:center;border-radius:22px;margin:24px 0;background:#762f3b;color:#fff;font-size:clamp(28px,5vw,48px);font-weight:900;transition:background .15s}.signal.ready{background:#008e69}.signal.wait{background:#a65a20}</style></head><body><main class="game"><h1>⚡ Реакция</h1><p>Нажми пробел или Enter, когда поле станет зелёным. Не нажимай раньше времени.</p><div id="signal" class="signal">НАЖМИ СТАРТ</div><div class="score" id="result">—</div><button id="start" class="primary">НАЧАТЬ</button><p class="muted" id="message">Твой лучший результат — самое быстрое время.</p><p class="muted">Esc — выйти</p></main><script>
const signal=document.getElementById('signal'),result=document.getElementById('result'),message=document.getElementById('message');let state='idle',timer=null,started=0,score=0;
function finish(value){clearTimeout(timer);state='done';score=value;result.textContent=value>0?`${value} очков`:'0 очков';parent.postMessage({type:'SCORE',score},'*')}
function start(){clearTimeout(timer);state='wait';result.textContent='Приготовься…';signal.className='signal wait';signal.textContent='ЖДИ ЗЕЛЁНЫЙ';message.textContent='Слишком рано нажимать нельзя!';timer=setTimeout(()=>{state='ready';started=performance.now();signal.className='signal ready';signal.textContent='ЖМИ!'},1200+Math.random()*3000)}
function press(){if(state==='wait'){signal.textContent='РАНО!';finish(0);message.textContent='Нажми «Начать» и дождись зелёного сигнала.';return}if(state==='ready'){const ms=Math.round(performance.now()-started);const pts=Math.max(1,Math.round(5000-ms));signal.textContent=`${ms} мс`;signal.className='signal';result.textContent=`${ms} мс · ${pts} очков`;message.textContent='Готово! Можно сыграть ещё раз.';finish(pts)}}
document.getElementById('start').onclick=start;addEventListener('keydown',e=>{if(e.key==='Escape'){parent.postMessage({type:'SCBB_GAME_ESCAPE'},'*');return}if(e.code==='Space'||e.key==='Enter'){e.preventDefault();if(state==='ready'||state==='wait')press();else if(state==='idle'||state==='done')start()}});signal.addEventListener('click',press);
</script></body></html>
